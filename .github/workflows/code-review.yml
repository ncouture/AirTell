name: "AirTell Code Review (Gemini 3.8 Flash // Antigravity SDK)"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base git ref to compare against (e.g. origin/main)"
        required: false
        default: "origin/main"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: "AI Code Review"
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install google-antigravity

      - name: "Execute Antigravity Code Review"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || inputs.base_ref || 'origin/main' }}"
          HEAD_REF="${{ github.event.pull_request.head.sha || 'HEAD' }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          echo "Reviewing diff between $BASE_REF and $HEAD_REF..."

          python scripts/code_review.py \
            --base "$BASE_REF" \
            --head "$HEAD_REF" \
            --pr-number "$PR_NUMBER" \
            --repo "$REPO" \
            --notebooklm-url "https://notebook.google.com/notebook/26cd837a-4d66-4ab1-94c7-128105718ad6" \
            --output review.md \
            --post-comment

      - name: "Archive Review Report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airtell-code-review-report
          path: review.md
          if-no-files-found: ignore
